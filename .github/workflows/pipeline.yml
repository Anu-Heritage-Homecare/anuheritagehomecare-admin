name: Pipeline

# Delivery pipeline for the admin frontend: quality (lint, type check, build),
# security scanning, a performance budget, and deployment to the Contabo VPS.
# Deploy runs only on a push to main and only after the three gates pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: quality. Lint, strict type check, production build.
  # ----------------------------------------------------------------------------
  lint:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # Stage 2: security. Dependency audit, secret scan, static analysis.
  # ----------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Dependency audit (production bundle)
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          version=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner

      - name: Static analysis (semgrep)
        run: |
          pipx install semgrep
          semgrep scan --error --config p/typescript --config p/javascript --config p/react --config p/secrets

  # ----------------------------------------------------------------------------
  # Stage 3: performance. Build and assert the bundle stays within budget.
  # ----------------------------------------------------------------------------
  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Assert bundle budget
        run: node scripts/assert-bundle.mjs

  # ----------------------------------------------------------------------------
  # Stage 4: deploy. Build and push the image (with the public API URL baked in),
  # then roll the VPS onto the new image. Only on main.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: [lint, security, performance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image repository
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Read public API URL from Doppler
        run: |
          VITE_API_URL=$(curl -sS --fail \
            -H "Authorization: Bearer ${{ secrets.DOPPLER_TOKEN }}" \
            "https://api.doppler.com/v3/configs/config/secrets/download?format=json" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("VITE_API_URL",""))')
          echo "VITE_API_URL=${VITE_API_URL}" >> "$GITHUB_ENV"
          echo "Baking VITE_API_URL=${VITE_API_URL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync deploy files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: deploy/docker-compose.prod.yml
          target: /opt/anu-heritage-admin
          strip_components: 1

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ADMIN_IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USER,GHCR_TOKEN,ADMIN_IMAGE
          script: |
            set -e
            cd /opt/anu-heritage-admin
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export ADMIN_IMAGE="$ADMIN_IMAGE"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
